[project]
name = "equip_rental"
authors = [
    { name = "Kreatao", email = "hello@kreatao.com" }
]
description = "Equipment rental management for ERPNext - internal usage, customer hire, portal and invoicing"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 99
target-version = "py310"
